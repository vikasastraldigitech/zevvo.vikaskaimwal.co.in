<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Items | ZEVVO</title>
  <meta name="description" content="View your saved wishlist items on ZEVVO and move them directly to your shopping bag.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main id="main-content" class="container my-3xl">
    <header class="listing-header mb-2xl">
      <h1 class="listing-title">SAVED ITEMS (<span id="wishlistHeaderCount">0</span>)</h1>
    </header>

    <div class="product-grid" id="wishlistGrid">
      <!-- JS Rendered -->
    </div>

    <div id="emptyWishlistMsg" class="text-center my-3xl" style="display: none;">
      <h3>YOUR WISHLIST IS CURRENTLY EMPTY</h3>
      <p class="text-muted mt-xs mb-lg">Save items you love by tapping the heart icon while browsing.</p>
      <a href="category.html?cat=new" class="btn btn-primary">EXPLORE NEW ARRIVALS</a>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module">
    import { Wishlist } from '../assets/js/modules/wishlist.js';
    import { API } from '../assets/js/utils/api.js';
    import { renderProductCardHTML, attachCardEventListeners } from '../assets/js/main.js';

    document.addEventListener('DOMContentLoaded', async () => {
      renderWishlist();

      window.addEventListener('zevvo:wishlist-updated', () => {
        renderWishlist();
      });
    });

    async function renderWishlist() {
      const ids = Wishlist.getWishlist();
      const allProducts = await API.getProducts();

      const countEl = document.getElementById('wishlistHeaderCount');
      if (countEl) countEl.textContent = ids.length;

      const grid = document.getElementById('wishlistGrid');
      const emptyMsg = document.getElementById('emptyWishlistMsg');

      if (ids.length === 0) {
        if (grid) grid.innerHTML = '';
        if (emptyMsg) emptyMsg.style.display = 'block';
        return;
      }

      if (emptyMsg) emptyMsg.style.display = 'none';

      const savedProducts = allProducts.filter(p => ids.includes(p.id));

      if (grid) {
        grid.innerHTML = savedProducts.map(p => renderProductCardHTML(p)).join('');
        attachCardEventListeners(grid, allProducts);
      }
    }
  </script>
</body>
</html>
