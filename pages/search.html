<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | ZEVVO</title>
  <meta name="description" content="Search ZEVVO products for modern apparel, room decor, lifestyle essentials, and beauty.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main id="main-content" class="container my-3xl">
    <header class="listing-header">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <i class="fa-solid fa-chevron-right text-xs"></i>
        <span>Search</span>
      </nav>
      <div class="listing-title-row">
        <h1 class="listing-title" id="searchQueryTitle">SEARCH RESULTS</h1>
        <span class="listing-count" id="searchCount">0 Items</span>
      </div>
    </header>

    <div class="my-3xl">
      <div class="product-grid" id="searchProductGrid">
        <!-- JS Rendered Cards -->
      </div>
      <div id="noResultsMsg" class="text-center my-3xl" style="display: none;">
        <h3>NO MATCHING PRODUCTS FOUND</h3>
        <p class="text-muted mt-xs mb-lg">Try checking your spelling or using more general terms.</p>
        <a href="category.html?cat=new" class="btn btn-primary">SHOP ALL NEW ARRIVALS</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module">
    import { API } from '../assets/js/utils/api.js';
    import { renderProductCardHTML, attachCardEventListeners } from '../assets/js/main.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const query = (params.get('q') || '').trim();

      const titleEl = document.getElementById('searchQueryTitle');
      const countEl = document.getElementById('searchCount');
      const grid = document.getElementById('searchProductGrid');
      const noResults = document.getElementById('noResultsMsg');

      if (titleEl) {
        titleEl.textContent = query ? `RESULTS FOR "${query.toUpperCase()}"` : 'SEARCH OUR COLLECTION';
      }

      const products = await API.getProducts();
      let matched = products;

      if (query) {
        const qLower = query.toLowerCase();
        matched = products.filter(p =>
          p.name.toLowerCase().includes(qLower) ||
          p.category.toLowerCase().includes(qLower) ||
          p.brand.toLowerCase().includes(qLower) ||
          (p.description && p.description.toLowerCase().includes(qLower))
        );
      }

      if (countEl) countEl.textContent = `${matched.length} Items`;

      if (matched.length > 0) {
        if (noResults) noResults.style.display = 'none';
        if (grid) {
          grid.innerHTML = matched.map(p => renderProductCardHTML(p)).join('');
          attachCardEventListeners(grid, products);
        }
      } else {
        if (grid) grid.innerHTML = '';
        if (noResults) noResults.style.display = 'block';
      }
    });
  </script>
</body>
</html>
