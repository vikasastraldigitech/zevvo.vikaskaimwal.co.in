<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Collection | ZEVVO</title>
  <meta name="description" content="Explore ZEVVO's latest apparel, home decor, music, and beauty collections. Clean, minimalist fashion and lifestyle essentials.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main id="main-content" class="container my-3xl">
    <!-- Header Info -->
    <header class="listing-header">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <i class="fa-solid fa-chevron-right text-xs"></i>
        <span id="breadcrumbCategory">Shop</span>
      </nav>
      <div class="listing-title-row">
        <h1 class="listing-title" id="pageTitle">ALL PRODUCTS</h1>
        <span class="listing-count" id="itemCount">0 Items</span>
      </div>
    </header>

    <!-- Controls Bar -->
    <div class="listing-controls">
      <button class="filter-toggle-btn" id="filterToggleBtn">
        <i class="fa-solid fa-sliders"></i> FILTER & SORT
      </button>

      <div class="sort-wrapper">
        <label for="sortSelect" class="sort-label">SORT BY:</label>
        <select id="sortSelect" class="sort-select">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="listing-layout has-sidebar">
      <!-- Desktop Sidebar Filters -->
      <aside class="filter-sidebar" id="desktopFilterSidebar">
        <!-- JS Populated Filters -->
      </aside>

      <!-- Product Grid -->
      <section>
        <div class="product-grid" id="listingProductGrid">
          <!-- JS Rendered Cards -->
        </div>

        <div class="text-center my-3xl" id="loadMoreContainer" style="display: none;">
          <button class="btn btn-outline" id="loadMoreBtn">LOAD MORE</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Mobile Filter Slide-Up Drawer -->
  <div class="filter-drawer-overlay" id="filterDrawerOverlay"></div>
  <div class="filter-drawer" id="filterDrawer">
    <div class="filter-drawer-header">
      <span class="font-heading font-bold text-sm">FILTER & SORT</span>
      <button id="filterDrawerClose" class="text-lg"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="filter-drawer-body" id="mobileFilterBody">
      <!-- Mobile Filters -->
    </div>
    <div class="filter-drawer-footer">
      <button class="btn btn-outline btn-full" id="clearFiltersBtn">CLEAR ALL</button>
      <button class="btn btn-primary btn-full" id="applyFiltersBtn">APPLY</button>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module">
    import { initListingPage } from '../assets/js/modules/filters.js';
    document.addEventListener('DOMContentLoaded', () => {
      initListingPage();
    });
  </script>
</body>
</html>
