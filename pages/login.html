<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register | ZEVVO</title>
  <meta name="description" content="Sign in to your ZEVVO account or register to manage orders, wishlists, and preferences.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main id="main-content" class="container my-3xl" style="max-width: 500px;">
    <!-- Tab Switcher -->
    <div class="flex justify-center gap-lg mb-2xl pb-xs" style="border-bottom: 1px solid var(--color-border);">
      <button class="font-heading font-bold text-lg uppercase" id="tabSignInBtn" style="border-bottom: 2px solid var(--color-text); padding-bottom: 0.5rem;">SIGN IN</button>
      <button class="font-heading font-bold text-lg uppercase text-muted" id="tabRegisterBtn" style="padding-bottom: 0.5rem;">REGISTER</button>
    </div>

    <!-- Sign In Form -->
    <div id="signInFormWrapper">
      <form id="signInForm" onsubmit="event.preventDefault(); alert('Signed in successfully!'); window.location.href='../index.html';">
        <div class="form-group">
          <label for="signEmail" class="form-label">Email Address *</label>
          <input type="email" id="signEmail" required class="form-input">
        </div>
        <div class="form-group">
          <label for="signPassword" class="form-label">Password *</label>
          <input type="password" id="signPassword" required class="form-input">
        </div>
        <div class="flex-between align-center mb-lg">
          <label class="form-checkbox">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="text-xs text-muted" style="text-decoration: underline;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">SIGN IN</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="registerFormWrapper" style="display: none;">
      <form id="registerForm" onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='../index.html';">
        <div class="grid gap-md mb-xs" style="display: grid; grid-template-columns: 1fr 1fr;">
          <div class="form-group">
            <label for="regFirstName" class="form-label">First Name *</label>
            <input type="text" id="regFirstName" required class="form-input">
          </div>
          <div class="form-group">
            <label for="regLastName" class="form-label">Last Name *</label>
            <input type="text" id="regLastName" required class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address *</label>
          <input type="email" id="regEmail" required class="form-input">
        </div>
        <div class="form-group">
          <label for="regPassword" class="form-label">Password *</label>
          <input type="password" id="regPassword" required placeholder="At least 8 characters" class="form-input">
        </div>
        <p class="text-xs text-muted mb-lg">By registering, you agree to ZEVVO Terms of Use and Privacy Policy.</p>
        <button type="submit" class="btn btn-primary btn-full btn-lg">CREATE ACCOUNT</button>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      const tabSignInBtn = document.getElementById('tabSignInBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');
      const signInForm = document.getElementById('signInFormWrapper');
      const registerForm = document.getElementById('registerFormWrapper');

      tabSignInBtn.addEventListener('click', () => {
        signInForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabSignInBtn.style.borderBottom = '2px solid var(--color-text)';
        tabSignInBtn.classList.remove('text-muted');
        tabRegisterBtn.style.borderBottom = 'none';
        tabRegisterBtn.classList.add('text-muted');
      });

      tabRegisterBtn.addEventListener('click', () => {
        signInForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabRegisterBtn.style.borderBottom = '2px solid var(--color-text)';
        tabRegisterBtn.classList.remove('text-muted');
        tabSignInBtn.style.borderBottom = 'none';
        tabSignInBtn.classList.add('text-muted');
      });
    });
  </script>
</body>
</html>
